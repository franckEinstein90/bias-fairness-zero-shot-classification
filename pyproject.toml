[project]
name = "bias-fairness-zero-shot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.39.0",
    "datasets>=4.8.4",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.46.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "accelerate>=1.13.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
